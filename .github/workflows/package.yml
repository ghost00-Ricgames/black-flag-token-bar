name: Package GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release version
        run: |
          python3 -c 'import json,os; v=json.load(open("module.json"))["version"]; tag=os.environ["RELEASE_TAG"]; assert tag=="v"+v, f"Tag {tag} does not match v{v}"'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Package module
        run: zip -r black-flag-token-bar.zip module.json scripts styles templates
      - name: Attach installation files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            black-flag-token-bar.zip
